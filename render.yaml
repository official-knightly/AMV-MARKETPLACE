services:
  - type: web
    name: vortex-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SECRET_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_MODEL
        value: moonshotai/kimi-k3
      - key: NVIDIA_ASSISTANT_MODEL
        value: nvidia/nemotron-3.5-lightning-30b-a3b
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_CONNECT_COUNTRY
        value: "IN"
      - key: FRONTEND_URL
        sync: false
      - key: PLATFORM_UPI_ID
        sync: false
      - key: PLATFORM_FEE_RATE
        value: "0.10"
      - key: AUTO_VERIFY_HOURS
        value: "72"

  - type: web
    name: vortex-frontend
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_GOOGLE_CLIENT_ID
        sync: false
      - key: NEXT_PUBLIC_DONATE_UPI
        sync: false
